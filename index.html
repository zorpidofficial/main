<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Pricing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #111827;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }

        .test-card {
            transition: all 0.2s ease;
        }
        
        .test-card:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }

        .selected-test {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 1px #3b82f6;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- Header & Search -->
        <header class="mb-8">
            <h1 class="text-2xl font-semibold mb-2">Diagnostic Pricing System</h1>
            <p class="text-gray-500 text-sm mb-6">Search and select tests to compare B2B and consumer lab pricing.</p>
            
            <div class="relative group">
                <input 
                    type="text" 
                    id="searchBar" 
                    placeholder="Search by test name (e.g. CBC, KFT)..." 
                    class="w-full p-4 pl-12 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm"
                >
                <svg class="absolute left-4 top-4 w-5 h-5 text-gray-400 group-focus-within:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                
                <!-- Search Results Dropdown -->
                <div id="searchResults" class="hidden absolute z-10 w-full mt-2 bg-white border border-gray-200 rounded-xl shadow-xl max-h-60 overflow-y-auto custom-scrollbar">
                </div>
            </div>
        </header>

        <!-- Selected Tests Chips -->
        <div id="selectedChips" class="flex flex-wrap gap-2 mb-8">
            <!-- Chips will appear here -->
        </div>

        <div id="dashboardContent" class="hidden">
            <!-- Global Filters -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Select Tier (5 or 6)</label>
                    <select id="tierFilter" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="6">Tier 6</option>
                        <option value="5">Tier 5</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Select Level (1, 2, or 3)</label>
                    <select id="levelFilter" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="1">Level 1</option>
                        <option value="2">Level 2</option>
                        <option value="3">Level 3</option>
                    </select>
                </div>
            </div>

            <!-- Comparison Sections -->
            <div class="space-y-12">
                <!-- B2B Lab Section -->
                <section>
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <span class="w-2 h-8 bg-blue-600 rounded-full"></span>
                        B2B Labs
                    </h2>
                    
                    <div class="overflow-x-auto bg-white rounded-2xl border border-gray-100 shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50/50 border-bottom border-gray-100">
                                    <th class="p-4 font-semibold text-gray-600">Lab & Test Name</th>
                                    <th class="p-4 font-semibold text-gray-600">DIP</th>
                                    <th class="p-4 font-semibold text-gray-600">MSP</th>
                                    <th class="p-4 font-semibold text-gray-600">BSP</th>
                                    <th class="p-4 font-semibold text-gray-600 bg-blue-50/50 text-blue-700">DSP (Selected)</th>
                                    <th class="p-4 font-semibold text-gray-600">MRP</th>
                                </tr>
                            </thead>
                            <tbody id="b2bTableBody">
                                <!-- Dynamic Rows -->
                            </tbody>
                            <tfoot id="b2bTableFoot" class="bg-gray-50 font-bold border-t-2 border-gray-100">
                                <!-- Totals -->
                            </tfoot>
                        </table>
                    </div>
                </section>

                <!-- Comparison Lab Section -->
                <section>
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <span class="w-2 h-8 bg-purple-600 rounded-full"></span>
                        Comparison Labs
                    </h2>
                    
                    <div class="overflow-x-auto bg-white rounded-2xl border border-gray-100 shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50/50">
                                    <th class="p-4 font-semibold text-gray-600">Comparison Lab</th>
                                    <th class="p-4 font-semibold text-gray-600">DSP</th>
                                    <th class="p-4 font-semibold text-gray-600">MRP</th>
                                    <th class="p-4 font-semibold text-gray-600">Margin (%)</th>
                                </tr>
                            </thead>
                            <tbody id="comparisonTableBody">
                                <!-- Dynamic Rows -->
                            </tbody>
                            <tfoot id="comparisonTableFoot" class="bg-gray-50 font-bold border-t-2 border-gray-100">
                                <!-- Totals -->
                            </tfoot>
                        </table>
                    </div>
                </section>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200">
            <div class="bg-gray-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
            </div>
            <h3 class="text-lg font-medium text-gray-900">No tests selected</h3>
            <p class="text-gray-500">Search for tests above to begin the comparison.</p>
        </div>
    </div>

    <script>
        // Data Structure from Main.json
        const mainData = {"CBC001":{"Test Name":"Complete Blood Count (CBC)","Department":"Pathology","Category":"I","Prognosis / DIP":60,"Prognosis / MSP":168,"Prognosis / MRP":350,"Prognosis / BSP":312,"Prognosis/DSP/6/3":219,"Prognosis/DSP/6/2":227,"Prognosis/DSP/6/1":234,"Prognosis/DSP/5/3":241,"Prognosis/DSP/5/2":249,"Prognosis/DSP/5/1":256,"Healthians / DIP":110,"Healthians / MSP":292,"Healthians / MRP":600,"Healthians / BSP":412,"Healthians/DSP/6/3":379,"Healthians/DSP/6/2":391,"Healthians/DSP/6/1":403,"Healthians/DSP/5/3":416,"Healthians/DSP/5/2":428,"Healthians/DSP/5/1":440,"Comparison/1MG/DSP":319,"Comparison/1MG/MRP":350,"Comparison/Healthians/DSP":303,"Comparison/Healthians/MRP":1010},"KFT001":{"Test Name":"Kidney Function Test (KFT)","Department":"Pathology","Category":"IV","Prognosis / DIP":100,"Prognosis / MSP":359,"Prognosis / MRP":800,"Prognosis / BSP":567,"Prognosis/DSP/6/3":483,"Prognosis/DSP/6/2":501,"Prognosis/DSP/6/1":518,"Prognosis/DSP/5/3":536,"Prognosis/DSP/5/2":554,"Prognosis/DSP/5/1":571,"Healthians / DIP":110,"Healthians / MSP":403,"Healthians / MRP":900,"Healthians / BSP":567,"Healthians/DSP/6/3":543,"Healthians/DSP/6/2":563,"Healthians/DSP/6/1":582,"Healthians/DSP/5/3":602,"Healthians/DSP/5/2":622,"Healthians/DSP/5/1":642,"Comparison/1MG/DSP":399,"Comparison/1MG/MRP":850,"Comparison/Healthians/DSP":427,"Comparison/Healthians/MRP":1423},"LFT001":{"Test Name":"Liver Function Test (LFT)","Department":"Pathology","Category":"II","Prognosis / DIP":80,"Prognosis / MSP":310,"Prognosis / MRP":700,"Prognosis / BSP":385,"Prognosis/DSP/6/3":420,"Prognosis/DSP/6/2":435,"Prognosis/DSP/6/1":451,"Prognosis/DSP/5/3":466,"Prognosis/DSP/5/2":482,"Prognosis/DSP/5/1":498,"Healthians / DIP":110,"Healthians / MSP":310,"Healthians / MRP":650,"Healthians / BSP":485,"Healthians/DSP/6/3":406,"Healthians/DSP/6/2":419,"Healthians/DSP/6/1":433,"Healthians/DSP/5/3":446,"Healthians/DSP/5/2":460,"Healthians/DSP/5/1":474,"Comparison/1MG/DSP":399,"Comparison/1MG/MRP":710,"Comparison/Healthians/DSP":379,"Comparison/Healthians/MRP":1263}}
        const selectedTestIds = new Set();
        const searchBar = document.getElementById('searchBar');
        const searchResults = document.getElementById('searchResults');
        const selectedChips = document.getElementById('selectedChips');
        const dashboardContent = document.getElementById('dashboardContent');
        const emptyState = document.getElementById('emptyState');
        const tierFilter = document.getElementById('tierFilter');
        const levelFilter = document.getElementById('levelFilter');

        // Initial render
        function updateUI() {
            if (selectedTestIds.size > 0) {
                dashboardContent.classList.remove('hidden');
                emptyState.classList.add('hidden');
            } else {
                dashboardContent.classList.add('hidden');
                emptyState.classList.remove('hidden');
            }

            renderChips();
            renderTables();
        }

        // Search logic
        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) {
                searchResults.classList.add('hidden');
                return;
            }

            const matches = Object.entries(mainData).filter(([id, data]) => 
                data['Test Name'].toLowerCase().includes(query) || id.toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                searchResults.innerHTML = matches.map(([id, data]) => `
                    <div class="p-4 cursor-pointer hover:bg-blue-50 border-b border-gray-100 flex justify-between items-center" onclick="selectTest('${id}')">
                        <div>
                            <span class="font-medium text-gray-900">${data['Test Name']}</span>
                            <span class="text-xs text-gray-400 ml-2">${id}</span>
                        </div>
                        ${selectedTestIds.has(id) ? '<span class="text-blue-500 text-xs font-bold">Selected</span>' : ''}
                    </div>
                `).join('');
                searchResults.classList.remove('hidden');
            } else {
                searchResults.innerHTML = '<div class="p-4 text-gray-400 text-sm">No tests found</div>';
                searchResults.classList.remove('hidden');
            }
        });

        window.selectTest = (id) => {
            if (selectedTestIds.has(id)) {
                selectedTestIds.delete(id);
            } else {
                selectedTestIds.add(id);
            }
            searchBar.value = '';
            searchResults.classList.add('hidden');
            updateUI();
        };

        function renderChips() {
            selectedChips.innerHTML = Array.from(selectedTestIds).map(id => `
                <div class="flex items-center gap-2 px-3 py-1.5 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">
                    ${mainData[id]['Test Name']}
                    <button onclick="selectTest('${id}')" class="hover:text-blue-900">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                    </button>
                </div>
            `).join('');
        }

        function calculateMargin(mrp, dsp) {
            if (!mrp || mrp === 0) return 0;
            return (((mrp - dsp) / mrp) * 100).toFixed(1);
        }

        function renderTables() {
            const tier = tierFilter.value;
            const level = levelFilter.value;
            const b2bBody = document.getElementById('b2bTableBody');
            const compBody = document.getElementById('comparisonTableBody');
            
            let b2bHtml = '';
            let compHtml = '';

            // Totals
            const totals = {
                prog: { dip: 0, msp: 0, bsp: 0, dsp: 0, mrp: 0 },
                health: { dip: 0, msp: 0, bsp: 0, dsp: 0, mrp: 0 },
                comp1MG: { dsp: 0, mrp: 0 },
                compHealth: { dsp: 0, mrp: 0 }
            };

            selectedTestIds.forEach(id => {
                const test = mainData[id];
                const pDsp = test[`Prognosis/DSP/${tier}/${level}`] || 0;
                const hDsp = test[`Healthians/DSP/${tier}/${level}`] || 0;

                // Accrue Totals B2B
                totals.prog.dip += test["Prognosis / DIP"];
                totals.prog.msp += test["Prognosis / MSP"];
                totals.prog.bsp += test["Prognosis / BSP"];
                totals.prog.dsp += pDsp;
                totals.prog.mrp += test["Prognosis / MRP"];

                totals.health.dip += test["Healthians / DIP"];
                totals.health.msp += test["Healthians / MSP"];
                totals.health.bsp += test["Healthians / BSP"];
                totals.health.dsp += hDsp;
                totals.health.mrp += test["Healthians / MRP"];

                // Accrue Totals Comparison
                totals.comp1MG.dsp += test["Comparison/1MG/DSP"] || 0;
                totals.comp1MG.mrp += test["Comparison/1MG/MRP"] || 0;
                totals.compHealth.dsp += test["Comparison/Healthians/DSP"] || 0;
                totals.compHealth.mrp += test["Comparison/Healthians/MRP"] || 0;

                // Build B2B Rows
                b2bHtml += `
                    <tr class="border-b border-gray-50 hover:bg-gray-50/50">
                        <td class="p-4"><div class="font-medium">${test['Test Name']}</div><div class="text-[10px] text-blue-500 uppercase tracking-tight">Prognosis</div></td>
                        <td class="p-4 text-gray-500">₹${test["Prognosis / DIP"]}</td>
                        <td class="p-4 text-gray-500">₹${test["Prognosis / MSP"]}</td>
                        <td class="p-4 text-gray-500">₹${test["Prognosis / BSP"]}</td>
                        <td class="p-4 font-bold text-blue-600 bg-blue-50/30">₹${pDsp}</td>
                        <td class="p-4 text-gray-500">₹${test["Prognosis / MRP"]}</td>
                    </tr>
                    <tr class="border-b border-gray-100 hover:bg-gray-50/50">
                        <td class="p-4"><div class="font-medium">${test['Test Name']}</div><div class="text-[10px] text-green-500 uppercase tracking-tight">Healthians</div></td>
                        <td class="p-4 text-gray-500">₹${test["Healthians / DIP"]}</td>
                        <td class="p-4 text-gray-500">₹${test["Healthians / MSP"]}</td>
                        <td class="p-4 text-gray-500">₹${test["Healthians / BSP"]}</td>
                        <td class="p-4 font-bold text-blue-600 bg-blue-50/30">₹${hDsp}</td>
                        <td class="p-4 text-gray-500">₹${test["Healthians / MRP"]}</td>
                    </tr>
                `;

                // Build Comp Rows
                compHtml += `
                    <tr class="border-b border-gray-50 bg-white">
                        <td class="p-4"><div class="font-medium">${test['Test Name']}</div><div class="text-[10px] text-orange-500 uppercase tracking-tight">1MG</div></td>
                        <td class="p-4">₹${test["Comparison/1MG/DSP"]}</td>
                        <td class="p-4">₹${test["Comparison/1MG/MRP"]}</td>
                        <td class="p-4 text-green-600 font-medium">${calculateMargin(test["Comparison/1MG/MRP"], test["Comparison/1MG/DSP"])}%</td>
                    </tr>
                    <tr class="border-b border-gray-100 bg-white">
                        <td class="p-4"><div class="font-medium">${test['Test Name']}</div><div class="text-[10px] text-pink-500 uppercase tracking-tight">Healthians (Retail)</div></td>
                        <td class="p-4">₹${test["Comparison/Healthians/DSP"]}</td>
                        <td class="p-4">₹${test["Comparison/Healthians/MRP"]}</td>
                        <td class="p-4 text-green-600 font-medium">${calculateMargin(test["Comparison/Healthians/MRP"], test["Comparison/Healthians/DSP"])}%</td>
                    </tr>
                `;
            });

            b2bBody.innerHTML = b2bHtml;
            compBody.innerHTML = compHtml;

            // Totals Rows
            document.getElementById('b2bTableFoot').innerHTML = `
                <tr>
                    <td class="p-4">Prognosis Total</td>
                    <td class="p-4">₹${totals.prog.dip}</td>
                    <td class="p-4">₹${totals.prog.msp}</td>
                    <td class="p-4">₹${totals.prog.bsp}</td>
                    <td class="p-4 text-blue-600">₹${totals.prog.dsp}</td>
                    <td class="p-4">₹${totals.prog.mrp}</td>
                </tr>
                <tr>
                    <td class="p-4">Healthians Total</td>
                    <td class="p-4">₹${totals.health.dip}</td>
                    <td class="p-4">₹${totals.health.msp}</td>
                    <td class="p-4">₹${totals.health.bsp}</td>
                    <td class="p-4 text-blue-600">₹${totals.health.dsp}</td>
                    <td class="p-4">₹${totals.health.mrp}</td>
                </tr>
            `;

            document.getElementById('comparisonTableFoot').innerHTML = `
                <tr>
                    <td class="p-4">1MG Total</td>
                    <td class="p-4">₹${totals.comp1MG.dsp}</td>
                    <td class="p-4">₹${totals.comp1MG.mrp}</td>
                    <td class="p-4 text-green-600">${calculateMargin(totals.comp1MG.mrp, totals.comp1MG.dsp)}%</td>
                </tr>
                <tr>
                    <td class="p-4">Healthians Total</td>
                    <td class="p-4">₹${totals.compHealth.dsp}</td>
                    <td class="p-4">₹${totals.compHealth.mrp}</td>
                    <td class="p-4 text-green-600">${calculateMargin(totals.compHealth.mrp, totals.compHealth.dsp)}%</td>
                </tr>
            `;
        }

        // Listen for filter changes
        tierFilter.addEventListener('change', renderTables);
        levelFilter.addEventListener('change', renderTables);

        // Close search results on click outside
        document.addEventListener('click', (e) => {
            if (!searchBar.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
